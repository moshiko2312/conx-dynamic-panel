sync:
  name: Sync
  description: Sync the active profile draft to the physical panel.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID of the panel.
      required: false
      selector:
        text:
    device_id:
      name: Device
      description: Device ID of the panel.
      required: false
      selector:
        device:
          integration: conx_dynamic_panel

activate_profile:
  name: Activate profile
  description: Activate a profile, optionally syncing immediately.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    device_id:
      name: Device
      required: false
      selector:
        device:
          integration: conx_dynamic_panel
    profile_id:
      name: Profile ID
      required: true
      selector:
        text:
    sync:
      name: Sync
      required: false
      default: false
      selector:
        boolean:

pull_from_panel:
  name: Pull from panel
  description: Pull current hardware values into the active profile draft.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    device_id:
      name: Device
      required: false
      selector:
        device:
          integration: conx_dynamic_panel

execute_button:
  name: Execute button
  description: Execute a button action without a physical press.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    device_id:
      name: Device
      required: false
      selector:
        device:
          integration: conx_dynamic_panel
    button:
      name: Button
      required: true
      selector:
        number:
          min: 1
          max: 4
          mode: box

reload:
  name: Reload
  description: Reload one or all ConX Dynamic Panel entries.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:

export_profiles:
  name: Export profiles
  description: >
    Return the portable profiles JSON payload (schema_version, active_profile_id,
    profiles). Same shape as the Lovelace card Export download and WebSocket
    conx_dynamic_panel/export_profiles.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    device_id:
      name: Device
      required: false
      selector:
        device:
          integration: conx_dynamic_panel

import_profiles:
  name: Import profiles
  description: >
    Import a portable profiles JSON payload exported by the card, wizard, or
    export_profiles service. mode=merge updates by id; mode=replace replaces all.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    device_id:
      name: Device
      required: false
      selector:
        device:
          integration: conx_dynamic_panel
    payload:
      name: Payload
      description: >
        Object with schema_version, optional active_profile_id, and profiles
        (object keyed by profile id, or array of profile objects).
      required: true
      selector:
        object:
    mode:
      name: Mode
      required: false
      default: merge
      selector:
        select:
          options:
            - merge
            - replace
