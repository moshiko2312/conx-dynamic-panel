[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conx-dynamic-panel"
version = "0.1.1"
description = "Private ConX Home Assistant integration for dynamic smart-panel profiles"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ConX" }]

[project.optional-dependencies]
dev = [
  "homeassistant>=2024.12.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component>=0.13",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["call-arg", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# iCloud Drive leaves stale "<name> 2.py" conflict copies next to the real
# files. They are gitignored, so skip them here too and keep local runs green.
addopts = ["--ignore-glob=* 2.py"]

[tool.setuptools.packages.find]
where = ["custom_components"]
